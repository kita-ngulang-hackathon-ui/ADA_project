[project]
name = "explain"
version = "0.0.0"
description = "Fact sheet, LLM prompt, narration validator, and template fallback."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explain"]

[tool.uv.sources]
core-contracts = { workspace = true }
