[project]
name = "churn-risk"
version = "0.0.0"
description = "TabPFN churn classifier with in-context examples and signal attribution."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
    "numpy",
    "scikit-learn",
    "tabpfn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_risk"]

[tool.uv.sources]
core-contracts = { workspace = true }
