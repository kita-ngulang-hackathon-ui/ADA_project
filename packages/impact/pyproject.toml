[project]
name = "impact"
version = "0.0.0"
description = "Intervention Impact Engine: two-model counterfactual and four segments."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
    "numpy",
    "scikit-learn",
    "tabpfn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impact"]

[tool.uv.sources]
core-contracts = { workspace = true }
