[project]
name = "ingest-mapping"
version = "0.0.0"
description = "Per-client event vocabulary to canonical events, plus pseudonymization."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_mapping"]

[tool.uv.sources]
core-contracts = { workspace = true }
