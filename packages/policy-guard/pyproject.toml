[project]
name = "policy-guard"
version = "0.0.0"
description = "Hard rule filters: responsible lending, frequency cap, no credit decisions."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_guard"]

[tool.uv.sources]
core-contracts = { workspace = true }
