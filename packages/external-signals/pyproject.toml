[project]
name = "external-signals"
version = "0.0.0"
description = "Feed items to canonical cohort/region/client signals."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/external_signals"]

[tool.uv.sources]
core-contracts = { workspace = true }
