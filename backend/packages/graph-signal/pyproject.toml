[project]
name = "graph-signal"
version = "0.0.0"
description = "Transaction-circle graph, delta_stability, and pattern tagging."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_signal"]

[tool.uv.sources]
core-contracts = { workspace = true }
