[project]
name = "measurement"
version = "0.0.0"
description = "Arm assignment (CONTROL / NAIVE / ENGINE) and incremental lift."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measurement"]

[tool.uv.sources]
core-contracts = { workspace = true }
