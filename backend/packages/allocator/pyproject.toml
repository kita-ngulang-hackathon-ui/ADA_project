[project]
name = "allocator"
version = "0.0.0"
description = "Decision Engine stage 3: 0-1 knapsack budget allocation with runner-ups."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allocator"]

[tool.uv.sources]
core-contracts = { workspace = true }
