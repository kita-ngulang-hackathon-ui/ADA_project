[project]
name = "core-contracts"
version = "0.0.0"
description = "Domain types, enums, and the recommendation state machine."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_contracts"]
