[project]
name = "api"
version = "0.0.0"
description = "FastAPI service: client ingestion API (/v1) and console API (/console/v1)."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
    "ingest-mapping",
    "measurement",
    "persistence",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
core-contracts = { workspace = true }
ingest-mapping = { workspace = true }
measurement = { workspace = true }
persistence = { workspace = true }
