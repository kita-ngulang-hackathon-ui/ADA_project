[project]
name = "worker"
version = "0.0.0"
description = "Pipeline runner, external feed adapter, and LLM narrator."
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
    "ingest-mapping",
    "external-signals",
    "graph-signal",
    "churn-risk",
    "impact",
    "policy-guard",
    "ranker",
    "allocator",
    "explain",
    "measurement",
    "feedback",
    "persistence",
    "httpx",
    "pydantic-settings",
    "pandas",
    "pyarrow",
    "tabpfn==9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
core-contracts = { workspace = true }
ingest-mapping = { workspace = true }
external-signals = { workspace = true }
graph-signal = { workspace = true }
churn-risk = { workspace = true }
impact = { workspace = true }
policy-guard = { workspace = true }
ranker = { workspace = true }
allocator = { workspace = true }
explain = { workspace = true }
measurement = { workspace = true }
feedback = { workspace = true }
persistence = { workspace = true }
