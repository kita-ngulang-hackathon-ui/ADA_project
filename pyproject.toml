# uv workspace root for [PROJECT NAME TBD].
[project]
name = "retention-engine-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "mypy", "ruff", "import-linter"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in argument default) is a false positive for FastAPI's
# Depends(...)/Query(...)/Cookie(...) dependency-injection idiom, which is
# how services/api's routers are written throughout.
ignore = ["B008"]
