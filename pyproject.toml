# uv workspace root for [PROJECT NAME TBD].
[project]
name = "retention-engine-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "core-contracts",
    "ingest-mapping",
    "external-signals",
    "graph-signal",
    "churn-risk",
    "impact",
    "policy-guard",
    "ranker",
    "allocator",
    "explain",
    "measurement",
    "feedback",
    "persistence",
    "worker",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
core-contracts = { workspace = true }
ingest-mapping = { workspace = true }
external-signals = { workspace = true }
graph-signal = { workspace = true }
churn-risk = { workspace = true }
impact = { workspace = true }
policy-guard = { workspace = true }
ranker = { workspace = true }
allocator = { workspace = true }
explain = { workspace = true }
measurement = { workspace = true }
feedback = { workspace = true }
persistence = { workspace = true }
worker = { workspace = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "mypy", "ruff", "import-linter"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in argument default) is a false positive for FastAPI's
# Depends(...)/Query(...)/Cookie(...) dependency-injection idiom, which is
# how services/api's routers are written throughout.
ignore = ["B008"]
